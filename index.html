<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Letter Learning</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main container for the app -->
    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <h1>Letter Learning Fun!</h1>
            <p>Type or click a letter to start the adventure</p>
            <div class="header-actions">
                <div class="dark-mode-toggle">
                    <i class="fas fa-moon"></i>
                    <label class="switch">
                        <input type="checkbox" id="dark-mode-switch">
                        <span class="slider round"></span>
                    </label>
                    <i class="fas fa-sun"></i>
                </div>
            </div>
            <div class="controls-container">
                <div class="category-selector">
                    <!-- Category buttons will be injected here by JS -->
                </div>
                
            </div>
        </header>

        <!-- Letter Grid Section -->
        <main id="letter-grid" class="letter-grid">
            <!-- Letter cards will be generated by JavaScript -->
        </main>

        <!-- Footer Section -->
        <footer class="app-footer">
            <p>Lazy coded with <i class="fas fa-heart"></i> for Zoey.</p>
        </footer>
    </div>

    <!-- Learning Modal -->
    <div id="learning-modal" class="modal-container">
        <div class="modal-content">
            <button id="close-modal" class="close-button">&times;</button>
            <div class="modal-letter-card">
                <div id="modal-letter-display" class="modal-letter">A</div>
            </div>
            <p id="modal-word-display" class="modal-word">Apple</p>
            <img id="modal-image" src="" alt="Image for word" class="modal-image">
            <button id="animal-sound-btn" class="sound-toggle">
                <i class="fas fa-paw"></i>
                <span>Animal Sound</span>
            </button>
            <div class="modal-navigation">
                <button id="modal-prev-btn"><i class="fas fa-arrow-left"></i> Prev</button>
                <button id="modal-speak-btn"><i class="fas fa-volume-up"></i> Speak</button>
                <button id="modal-next-btn">Next <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <script src="script.js?v=1.1" defer></script>
</body>
</html>
